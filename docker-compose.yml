services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: borrow_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d borrow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - borrow-network

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    image: users-service
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/borrow_db
      - SECRET_KEY=super-secret-key-for-gcp-poc
      - INTERNAL_API_KEY=super-secret-key-for-gcp-poc
    ports:
      - "8001:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - borrow-network

  books:
    build:
      context: ./services/books
      dockerfile: Dockerfile
    image: books-service
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/borrow_db
      - SECRET_KEY=super-secret-key-for-gcp-poc
      - INTERNAL_API_KEY=super-secret-key-for-gcp-poc
    ports:
      - "8002:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - borrow-network

  borrow:
    build:
      context: ./services/borrow
      dockerfile: Dockerfile
    image: borrow-service
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/borrow_db
      - SECRET_KEY=super-secret-key-for-gcp-poc
      - INTERNAL_API_KEY=super-secret-key-for-gcp-poc
      - USERS_SERVICE_URL=http://users:8080
      - BOOKS_SERVICE_URL=http://books:8080
    ports:
      - "8003:8080"
    depends_on:
      db:
        condition: service_healthy
      users:
        condition: service_started
      books:
        condition: service_started
    networks:
      - borrow-network

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - users
      - books
      - borrow
    networks:
      - borrow-network

networks:
  borrow-network:
    driver: bridge
