steps:
  # 1. Build Users Service Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:latest',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:${SHORT_SHA}',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:latest',
      'services/users'
    ]
    id: 'build-users'
    waitFor: ['-'] # Start immediately

  # 2. Build Books Service Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:latest',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:${SHORT_SHA}',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:latest',
      'services/books'
    ]
    id: 'build-books'
    waitFor: ['-'] # Start immediately

  # 3. Build Borrow Service Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:latest',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:${SHORT_SHA}',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:latest',
      'services/borrow'
    ]
    id: 'build-borrow'
    waitFor: ['-'] # Start immediately

  # 4. Build Docs Service Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:latest',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:${SHORT_SHA}',
      '-t', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:latest',
      'services/docs'
    ]
    id: 'build-docs'
    waitFor: ['-'] # Start immediately

  # 4. Push All Images (Parallel)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:${SHORT_SHA}']
    id: 'push-users-sha'
    waitFor: ['build-users']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:latest']
    id: 'push-users-latest'
    waitFor: ['build-users']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:${SHORT_SHA}']
    id: 'push-books-sha'
    waitFor: ['build-books']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:latest']
    id: 'push-books-latest'
    waitFor: ['build-books']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:${SHORT_SHA}']
    id: 'push-borrow-sha'
    waitFor: ['build-borrow']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:${SHORT_SHA}']
    id: 'push-docs-sha'
    waitFor: ['build-docs']


  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:latest']
    id: 'push-borrow-latest'
    waitFor: ['build-borrow']

  # 5. Deploy Services (Parallel)
  # Deploy API Gateway (Idempotent script)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['scripts/deploy_gateway.sh', '${PROJECT_ID}']
    id: 'deploy-gateway'
    waitFor: ['-']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'users-service',
      '--image', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:${SHORT_SHA}',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'ai-assistant-cloud-run-sa@teak-strength-485420-v3.iam.gserviceaccount.com'
    ]
    id: 'deploy-users'
    waitFor: ['push-users-sha']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'books-service',
      '--image', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:${SHORT_SHA}',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'ai-assistant-cloud-run-sa@teak-strength-485420-v3.iam.gserviceaccount.com'
    ]
    id: 'deploy-books'
    waitFor: ['push-books-sha']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'borrow-service',
      '--image', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:${SHORT_SHA}',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'ai-assistant-cloud-run-sa@teak-strength-485420-v3.iam.gserviceaccount.com'
    ]
    id: 'deploy-borrow'
    waitFor: ['push-borrow-sha']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'docs-service',
      '--image', 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:${SHORT_SHA}',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'ai-assistant-cloud-run-sa@teak-strength-485420-v3.iam.gserviceaccount.com'
    ]
    id: 'deploy-docs'
    waitFor: ['push-docs-sha']


  # 6. Run E2E Smoke Tests
  - name: 'python:3.10-slim'
    entrypoint: /bin/sh
    args:
      - -c
      - |
        pip install httpx pytest pytest-asyncio
        pytest tests/e2e
    secretEnv: ['API_KEY']
    env:
      - 'DOCS_SERVICE_URL=https://docs-service-933812900131.us-central1.run.app'
    id: 'e2e-tests'
    waitFor: ['deploy-users', 'deploy-books', 'deploy-borrow', 'deploy-docs', 'deploy-gateway']

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/users-service:latest'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/books-service:latest'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/borrow-service:latest'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/borrow-api-repo/docs-service:latest'


options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/borrow-api-key/versions/latest
    env: 'API_KEY'
